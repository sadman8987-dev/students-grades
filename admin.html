<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081a2b"><title>لوحة ردود الطلاب</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#071827;--panel:#10283a;--line:#31566c;--text:#f6fbff;--muted:#9eb5c7;--accent:#58e0c0}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;font-family:Cairo,system-ui,sans-serif;color:var(--text);background:radial-gradient(700px 360px at 88% -8%,#17546d 0%,transparent 65%),radial-gradient(650px 400px at -8% 100%,#123d47 0%,transparent 62%),var(--bg)}main{position:relative;overflow:hidden;width:min(100%,720px);margin:18px auto;padding:29px;border:1px solid var(--line);border-radius:27px;background:linear-gradient(150deg,#122f44f5,#0b1d2df7 78%);box-shadow:0 28px 80px #0009}main:before{content:"";position:absolute;top:0;right:12%;left:12%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}h1{margin:0 0 5px;font-size:25px}header p{margin:0 0 24px;color:var(--muted);font-size:12px}input,button{width:100%;padding:13px 14px;border-radius:14px;font:500 14px Cairo}input{border:1px solid #35576d;background:#071725;color:var(--text);outline:0}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #58e0c01c}button{margin-top:10px;border:0;background:linear-gradient(100deg,var(--accent),#73d5e5);color:#06242d;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{margin-top:16px;color:#b5f8e5;font-size:13px;font-weight:700}.item{margin-top:12px;padding:15px;border:1px solid #2b4c61;border-radius:14px;background:#0b2031;line-height:1.9;white-space:pre-wrap}.date{margin-top:7px;color:#7791a3;font-size:11px}@media(max-width:430px){main{padding:22px;border-radius:23px}h1{font-size:22px}}
</style></head><body><main><header><h1>لوحة ردود الطلاب</h1><p>عرض الملاحظات المرسلة من الطلاب بشكل آمن.</p></header><form id="login"><input id="token" type="password" placeholder="رمز دخول الإدارة" required><button>عرض الردود</button></form><div id="status"></div><section id="list"></section></main><script>
const API="https://zyswxsopfkcznpbtabnh.supabase.co/functions/v1/feedback-admin";const form=document.getElementById("login"),status=document.getElementById("status"),list=document.getElementById("list");form.addEventListener("submit",async e=>{e.preventDefault();status.textContent="جارٍ تحميل الردود...";list.innerHTML="";try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:document.getElementById("token").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر التحميل");status.textContent="عدد الردود: "+d.feedback.length;if(!d.feedback.length){list.textContent="لا توجد ردود حتى الآن.";return}d.feedback.forEach((x,i)=>{const box=document.createElement("article");box.className="item";const body=document.createElement("div");body.textContent=(i+1)+". "+x.feedback;const date=document.createElement("div");date.className="date";date.textContent=new Date(x.created_at).toLocaleString("ar-EG");box.append(body,date);list.append(box)})}catch(err){status.textContent=err.message}});
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ردود الطلاب</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;padding:24px;color:#222}
main{max-width:700px;margin:40px auto;background:white;padding:24px;border-radius:12px}
h2{margin-top:0}input,button{font:16px Arial;padding:12px;border-radius:7px}
input{width:calc(100% - 26px);border:1px solid #ccc}
button{border:0;background:#1769d2;color:white;cursor:pointer;margin-top:10px}
.item{border:1px solid #ddd;border-radius:8px;padding:14px;margin-top:12px;white-space:pre-wrap}
.date{font-size:12px;color:#777;margin-top:8px}
#status{margin-top:12px;color:#555}
</style></head>
<body><main>
<h2>ردود الطلاب</h2>
<p>صفحة خاصة لعرض آراء الطلاب.</p>
<form id="login"><input id="token" type="password" placeholder="رمز دخول الإدارة" required><br><button>عرض الردود</button></form>
<div id="status"></div><section id="list"></section>
</main>
<script>
const API="https://zyswxsopfkcznpbtabnh.supabase.co/functions/v1/feedback-admin";
const form=document.getElementById("login"),status=document.getElementById("status"),list=document.getElementById("list");
form.addEventListener("submit",async e=>{
 e.preventDefault();status.textContent="جارٍ تحميل الردود...";list.innerHTML="";
 try{
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:document.getElementById("token").value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر التحميل");
  status.textContent="عدد الردود: "+d.feedback.length;
  if(!d.feedback.length){list.textContent="لا توجد ردود حتى الآن.";return}
  d.feedback.forEach((x,i)=>{const box=document.createElement("article");box.className="item";const body=document.createElement("div");body.textContent=(i+1)+". "+x.feedback;const date=document.createElement("div");date.className="date";date.textContent=new Date(x.created_at).toLocaleString("ar-EG");box.append(body,date);list.append(box)});
 }catch(err){status.textContent=err.message}
});
</script></body></html>

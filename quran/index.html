<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09251f"><meta name="description" content="القرآن الكريم كاملاً — قراءة واستماع لجميع سور القرآن الكريم">
<title>القرآن الكريم | وِرد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#071b17;--panel:#102b24;--panel2:#15372e;--line:#285044;--gold:#d8b66a;--text:#f6f2e8;--muted:#a9bdb3;--green:#8bd3ae}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1d5140 0,transparent 55%),var(--bg);color:var(--text);font-family:Cairo, sans-serif;min-height:100vh}
header{padding:32px 18px 22px;text-align:center;border-bottom:1px solid #ffffff12}.logo{width:58px;height:58px;border:1px solid #d8b66a80;border-radius:18px;margin:auto;display:grid;place-items:center;color:var(--gold);font-size:30px;background:#d8b66a12}h1{font-family:Amiri,serif;font-size:clamp(32px,7vw,48px);margin:9px 0 0;color:var(--gold)}header p{color:var(--muted);margin:0;font-size:13px}
.wrap{width:min(100% - 28px,1050px);margin:24px auto 50px}.top{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px 16px;color:var(--text);font:14px Cairo;outline:none}.search:focus{border-color:var(--gold)}button,select{font:600 13px Cairo;cursor:pointer}.select{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0 12px}
.layout{display:grid;grid-template-columns: minmax(240px,320px) 1fr;gap:18px;align-items:start}.list,.reader{border:1px solid var(--line);background:#0d251fdd;border-radius:20px;overflow:hidden}.list-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--gold);font-weight:700}.surahs{max-height:68vh;overflow:auto;overscroll-behavior:contain;padding:8px}.surah{width:100%;display:flex;align-items:center;gap:12px;text-align:right;border:0;background:transparent;color:var(--text);padding:11px;border-radius:12px}.surah:hover,.surah.active{background:var(--panel2)}.num{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid #d8b66a55;transform:rotate(45deg);border-radius:9px;color:var(--gold);font-size:12px}.num span{transform:rotate(-45deg)}.surah-name{font-weight:700}.surah-meta{display:block;color:var(--muted);font-size:10px;font-weight:400}.reader{min-height:440px}.reader-head{text-align:center;padding:24px 16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#173c30,#102920)}.reader-head h2{font: bold 32px Amiri;color:var(--gold);margin:0}.reader-head p{color:var(--muted);font-size:11px;margin:4px 0 13px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.ctrl{border:1px solid #547366;background:#0b211b;color:var(--text);padding:8px 13px;border-radius:10px}.ctrl.primary{background:#c8a85f;color:#18251d;border-color:var(--gold)}.verses{padding:22px clamp(14px,4vw,38px);font:29px/2.2 'Amiri Quran',Amiri,serif;text-align:justify}.bismillah{text-align:center;color:var(--gold);font:29px 'Amiri Quran',Amiri,serif;margin:0 0 18px}.ayah{display:inline}.ayah-num{font:13px Cairo;color:var(--gold);white-space:nowrap;padding:0 5px}.status{padding:38px 16px;text-align:center;color:var(--muted)}audio{width:100%;height:38px;margin-top:14px;filter:sepia(.25)}.foot{text-align:center;color:#718b7e;font-size:11px;margin:18px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.surahs{max-height:260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.surah{padding:8px;gap:8px}.num{width:30px;height:30px}.reader{min-height:380px}.top{grid-template-columns:1fr}.select{padding:10px}.verses{font-size:24px}}
</style>
</head>
<body>
<header><div class="logo">۞</div><h1>القرآن الكريم</h1><p>اقرأ، واستمع، وتدبّر — جميع سور القرآن الكريم</p></header>
<main class="wrap">
<div class="top"><input id="search" class="search" placeholder="ابحث عن سورة..." aria-label="ابحث عن سورة"><select id="reciter" class="select" aria-label="اختر القارئ"><option value="ar.alafasy">مشاري العفاسي</option><option value="ar.abdurrahmaansudais">عبدالرحمن السديس</option><option value="ar.mahermuaiqly">ماهر المعيقلي</option><option value="ar.husary">محمود خليل الحصري</option></select></div>
<div class="layout"><aside class="list"><div class="list-head"><span>سور القرآن</span><span id="count">114 سورة</span></div><div id="surahs" class="surahs"><div class="status">جارٍ تحميل فهرس السور...</div></div></aside>
<section class="reader"><div id="reader"><div class="status">اختر سورة من القائمة لبدء القراءة والاستماع 🌿</div></div></section></div>
<p class="foot">المصحف يعرض النص بالرسم الإملائي عبر خدمة AlQuran Cloud. يلزم اتصال بالإنترنت لتحميل النص والصوت.</p>
</main>
<script>
const API='https://api.alquran.cloud/v1';let all=[],current=0,cache=new Map();const $=s=>document.querySelector(s);
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('تعذر الاتصال بمصدر القرآن الكريم');const d=await r.json();if(d.code!==200)throw Error('تعذر تحميل البيانات');return d.data}
function renderList(q=''){const root=$('#surahs');const arr=all.filter(s=>s.name.includes(q)||s.englishName.toLowerCase().includes(q.toLowerCase())||String(s.number)===q.trim());$('#count').textContent=arr.length+' سورة';root.innerHTML=arr.map(s=>'<button class="surah '+(s.number===current?'active':'')+'" data-id="'+s.number+'"><span class="num"><span>'+s.number+'</span></span><span><span class="surah-name">'+s.name+'</span><span class="surah-meta">'+(s.revelationType==='Meccan'?'مكية':'مدنية')+' • '+s.numberOfAyahs+' آية</span></span></button>').join('')||'<div class="status">لا توجد سورة بهذا الاسم</div>'}
async function openSurah(id){current=id;renderList($('#search').value);const s=all.find(x=>x.number===id);$('#reader').innerHTML='<div class="status">جارٍ تحميل سورة '+s.name+'...</div>';try{let data=cache.get(id);if(!data){data=await json(API+'/surah/'+id+'/quran-uthmani');cache.set(id,data)}const ayahs=data.ayahs;const showBismillah=id!==1&&id!==9;$('#reader').innerHTML='<div class="reader-head"><h2>'+s.name+'</h2><p>'+(s.revelationType==='Meccan'?'مكية':'مدنية')+' • '+s.numberOfAyahs+' آية</p><div class="controls"><button class="ctrl" id="prev">السورة السابقة</button><button class="ctrl primary" id="play">▶ استماع للسورة</button><button class="ctrl" id="next">السورة التالية</button></div><audio id="audio" controls preload="none"></audio></div><div class="verses">'+(showBismillah?'<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'')+ayahs.map(a=>'<span class="ayah">'+a.text+' <span class="ayah-num">۞ '+a.numberInSurah+'</span></span>').join(' ')+'</div>';
$('#prev').onclick=()=>openSurah(id>1?id-1:114);$('#next').onclick=()=>openSurah(id<114?id+1:1);$('#play').onclick=async()=>{const audio=$('#audio');if(!audio.src){$('#play').textContent='جارٍ تجهيز الصوت...';try{const rec=$('#reciter').value;const aud=await json(API+'/surah/'+id+'/'+rec);audio.src=aud.audio;$('#play').textContent='▶ استماع للسورة';await audio.play()}catch(e){$('#play').textContent='تعذر تشغيل الصوت'}}else audio.play()};$('#reader').scrollIntoView({behavior:'smooth',block:'nearest'});localStorage.setItem('lastSurah',id)
}catch(e){$('#reader').innerHTML='<div class="status">'+e.message+'<br><button class="ctrl" onclick="openSurah('+id+')">إعادة المحاولة</button></div>'}}
$('#surahs').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openSurah(Number(b.dataset.id))});$('#search').addEventListener('input',e=>renderList(e.target.value.trim()));$('#reciter').addEventListener('change',()=>{if(current) {const a=$('#audio');if(a){a.pause();a.removeAttribute('src');a.load();$('#play').textContent='▶ استماع للسورة'}}});
(async()=>{try{all=await json(API+'/surah');renderList();const last=Number(localStorage.getItem('lastSurah'))||1;openSurah(last)}catch(e){$('#surahs').innerHTML='<div class="status">'+e.message+'<br>تأكد من اتصال الإنترنت ثم حدّث الصفحة.</div>'}})();
</script>
</body></html>

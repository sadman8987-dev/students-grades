<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رأيك يهمنا</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
main{max-width:520px;margin:70px auto;background:#fff;padding:28px;border-radius:12px}
h2{margin:0 0 10px;font-size:24px}
p{color:#666;line-height:1.7;margin:0 0 22px}
textarea{width:100%;min-height:180px;padding:14px;border:1px solid #ccc;border-radius:8px;font:16px Arial;resize:vertical}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:#1769d2;color:white;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
#message{margin-top:14px;font-size:14px}
</style>
</head>
<body>
<main>
<h2>رأيك يهمنا</h2>
<p>اكتب رأيك أو اقتراحك عن الشرح. إرسال بدون اسم أو إيميل.</p>
<form id="form">
<textarea id="feedback" maxlength="3000" minlength="3" required placeholder="اكتب رأيك هنا..."></textarea>
<button id="send" type="submit">إرسال</button>
</form>
<div id="message" role="status"></div>
</main>
<script>
const API="https://zyswxsopfkcznpbtabnh.supabase.co/functions/v1/student-feedback";
const form=document.getElementById("form"),field=document.getElementById("feedback"),button=document.getElementById("send"),message=document.getElementById("message");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const feedback=field.value.trim();
 if(feedback.length<3){message.textContent="اكتب 3 أحرف على الأقل.";return}
 button.disabled=true;button.textContent="جارٍ الإرسال...";
 try{
  const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({feedback})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"تعذر الإرسال");
  form.reset();message.textContent="تم إرسال رأيك، شكرًا لك.";
 }catch(error){message.textContent="حصلت مشكلة أثناء الإرسال. حاول مرة أخرى."}
 finally{button.disabled=false;button.textContent="إرسال"}
});
</script>
</body>
</html>
